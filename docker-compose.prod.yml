# Kiota on one Ubuntu server: PostgreSQL 17, the app, Caddy (automatic HTTPS) and nightly backups.
# Usage (see docs/deploy.md):
#   cp .env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: kiota

x-app-env: &app-env
  NODE_ENV: production
  SITE_URL: https://${SITE_DOMAIN}
  APP_URL: https://${APP_DOMAIN}
  # The app connects as kiota_app (no superuser, no BYPASSRLS): row-level security always applies.
  APP_DATABASE_URL: postgresql://kiota_app:${APP_DB_PASSWORD}@db:5432/kiota
  AUTH_SECRET: ${AUTH_SECRET}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
  MPESA_CALLBACK_BASE_URL: ${MPESA_CALLBACK_BASE_URL:-}
  SMS_DRIVER: ${SMS_DRIVER}
  ALLOW_CONSOLE_SMS: ${ALLOW_CONSOLE_SMS:-0}
  STORAGE_DRIVER: local
  LOCAL_STORAGE_DIR: /data/storage
  TZ: Africa/Nairobi

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # The owner role: owns the tables and the SECURITY DEFINER functions (a superuser here,
      # which the row-level security design requires). Used only by "migrate" and backups.
      POSTGRES_USER: kiota_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kiota
      TZ: Africa/Nairobi
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiota_owner -d kiota"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: the database is reachable only from the other containers.

  migrate:
    build:
      context: .
      target: migrator
      args:
        SITE_URL: https://${SITE_DOMAIN}
        APP_URL: https://${APP_DOMAIN}
    environment:
      DATABASE_URL: postgresql://kiota_owner:${POSTGRES_PASSWORD}@db:5432/kiota
      APP_DATABASE_URL: postgresql://kiota_app:${APP_DB_PASSWORD}@db:5432/kiota
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        SITE_URL: https://${SITE_DOMAIN}
        APP_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: kiota_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: kiota
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Africa/Nairobi
    entrypoint: ["bash", "/scripts/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
      - storage:/data/storage:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
